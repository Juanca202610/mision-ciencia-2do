const KEY='mision-ciencia-aventura-v2';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{};let state={screen:'home',world:0,challenge:0,selected:-1,done:[],order:[],mistakes:0,feedback:'',feedbackType:'',simCount:0,simVal:0,music:true,voice:true,sessionScore:0};let audioCtx=null,musicInterval=null,musicBeat=0,voiceReady=false;
const app=document.getElementById('app');const popRoot=document.getElementById('popRoot');const escaped=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch{}}function completed(w,c){return !!saved[w+'-'+c]}function totalCompleted(){return Object.keys(saved).filter(k=>saved[k]).length}function totalStars(){return totalCompleted()*3}function popStars(){for(let i=0;i<9;i++){let e=document.createElement('div');e.className='floatstar';e.textContent=['⭐','✨','🌟'][i%3];e.style.left=(20+Math.random()*60)+'vw';e.style.top=(30+Math.random()*40)+'vh';document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}}
function initAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();if(state.music&&!musicInterval){musicInterval=setInterval(musicTick,230)}}catch{}}function note(freq,d=.15,type='sine',vol=.055){if(!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+d+.01)}catch{}}function musicTick(){if(!state.music||!audioCtx)return;const tune=[392,493.88,587.33,493.88,440,523.25,659.25,523.25,392,493.88,587.33,783.99,698.46,587.33,523.25,493.88];const n=tune[musicBeat%tune.length];note(n,.19,'triangle',.017);if(musicBeat%4===0)note(n/2,.4,'sine',.012);musicBeat++}function sfx(ok){initAudio();if(ok){[523,659,784,1046].forEach((n,i)=>setTimeout(()=>note(n,.22,'sine',.09),i*90))}else{note(220,.17,'sawtooth',.03);setTimeout(()=>note(160,.17,'sawtooth',.02),120)}}
function voice(text){if(!state.voice||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=.87;u.pitch=1.18;u.volume=.95;let vs=speechSynthesis.getVoices();let es=vs.filter(v=>/^es[-_]/i.test(v.lang));let fem=es.find(v=>/female|mujer|helena|elena|monica|mónica|paulina|sabina|lucia|lucía|sofia|sofía|paloma|laura|isabela|google español|microsoft elvira|microsoft dalia/i.test(v.name));u.voice=fem||es[0]||null;speechSynthesis.speak(u)}catch{}}
function say(text){initAudio();voice(text)}function announce(text,good){state.feedback=text;state.feedbackType=good?'good':'bad';const f=document.getElementById('feedback');if(f){f.textContent=text;f.className='feedback '+state.feedbackType}if(good){sfx(true)}else{sfx(false)}say(text)}function controls(){return `<div class="topbar"><div class="brand">🧑‍🚀 MISIÓN CIENCIA<small>¡Aprende jugando, Yance!</small></div><div class="controls"><span class="chip">⭐ ${totalStars()} estrellas</span><button class="ctl ${state.music?'':'off'}" onclick="toggleMusic()" aria-label="Activar o silenciar música">${state.music?'🎵 Música':'🔇 Música'}</button><button class="ctl ${state.voice?'':'off'}" onclick="toggleVoice()" aria-label="Activar o silenciar voz">${state.voice?'🗣️ Voz':'🔕 Voz'}</button></div></div>`}function toggleMusic(){state.music=!state.music;initAudio();draw()}function toggleVoice(){state.voice=!state.voice;if(!state.voice&&'speechSynthesis' in window)speechSynthesis.cancel();draw();if(state.voice)say('¡Hola Yance! Soy la profesora Luna. ¡Vamos a jugar!')}
function drawHome(){let g=worlds.map((w,i)=>{let count=w.challenges.filter((_,j)=>completed(i,j)).length;return `<button class="world" onclick="openWorld(${i})"><div class="worldart" style="background:${w.bg}">${w.icon}<span class="twinkle">${count===6?'🏆':'✨'}</span></div><div class="worldbody"><strong>Mundo ${i+1}: ${w.title}</strong><p>${w.sub}</p><div class="progress"><div style="width:${count/6*100}%"></div></div><small>${count} de 6 misiones completadas</small></div></button>`}).join('');app.innerHTML=controls()+`<div class="hero"><div><div class="eyebrow">🎮 Videojuego de ciencias • 2.º de primaria</div><h1>¡Salvemos<br>el planeta! 🌍</h1><p>¡Hola, Yance! Soy <b>Luna</b>, tu profesora exploradora. Entra a cualquier mundo, <b>arrastra, busca, ordena y experimenta</b>. ¡Gana estrellas y medallas!</p><button class="bigbtn" onclick="openWorld(0)">🚀 ¡EMPEZAR A JUGAR!</button><div><span class="smalltag">🧩 42 minijuegos</span> <span class="smalltag">🔊 Voz en español</span> <span class="smalltag">🎵 Música original</span></div></div><div class="mascot" role="img" aria-label="Profesora exploradora">👩‍🚀🌎</div></div><div class="sectionhead"><h2>🗺️ Elige tu mundo — ¡todos están abiertos!</h2><span>${totalCompleted()}/42 misiones superadas</span></div><div class="worldgrid">${g}</div><footer>Juego educativo gratuito · Tu progreso se guarda en este navegador · Pulsa 🎵 o 🗣️ para controlar el sonido</footer>`}
function openWorld(i){initAudio();state.world=i;let c=worlds[i].challenges.findIndex((_,j)=>!completed(i,j));state.challenge=c<0?0:c;state.screen='play';resetTask();draw();say(`¡Bienvenido a ${worlds[i].title}! ${task().hint}`)}function task(){return worlds[state.world].challenges[state.challenge]}function resetTask(){state.selected=-1;state.done=[];state.order=[];state.mistakes=0;state.feedback='';state.feedbackType='';state.simCount=0;state.simVal=0;state.simDone=false}function goHome(){popRoot.innerHTML='';state.screen='home';if('speechSynthesis' in window)speechSynthesis.cancel();draw()}function draw(){if(state.screen==='home')drawHome();else drawPlay()}
function drawPlay(){let w=worlds[state.world],t=task();let body='';if(t.type==='sort')body=renderSort(t);if(t.type==='hunt')body=renderHunt(t);if(t.type==='sequence')body=renderSequence(t);if(t.type==='sim')body=renderSim(t);let count=w.challenges.filter((_,j)=>completed(state.world,j)).length;app.innerHTML=controls()+`<section class="play"><div class="playhead"><button class="back" onclick="goHome()">← Elegir mundo</button><div><strong>${w.icon} Mundo ${state.world+1}: ${w.title}</strong><div class="leveltext">Misión ${state.challenge+1} de 6 · ${count} superadas</div></div><button class="back" onclick="nextMission()">Siguiente →</button></div><div class="playinner"><div class="eyebrow">✨ DESAFÍO ${state.challenge+1} · ${t.type==='sort'?'ARRASTRAR Y AGRUPAR':t.type==='hunt'?'BUSCAR Y TOCAR':t.type==='sequence'?'ORDENAR': 'EXPERIMENTAR'}</div><h2 class="tasktitle">${t.title}</h2><p class="hint">${t.hint} <button class="voicebtn" onclick="say(task().hint)">🔊 Escuchar</button></p><div class="taskboard" id="taskboard">${body}</div><div class="feedback ${state.feedbackType}" id="feedback" aria-live="polite">${state.feedback||'👩‍🚀 Luna: ¡Tú puedes! Vamos a comenzar.'}</div><div class="nextrow"><button class="btn secondary" onclick="retry()">🔄 Repetir</button><button class="btn" onclick="nextMission()">Otra misión ➜</button></div></div></section>`}function retry(){resetTask();drawPlay();say(task().hint)}function nextMission(){popRoot.innerHTML='';state.challenge=(state.challenge+1)%6;resetTask();drawPlay();say(task().hint)}
function renderSort(t){let items=t.items.map((it,i)=>`<button class="tile ${state.selected===i?'selected':''} ${state.done.includes(i)?'done':''}" draggable="true" ondragstart="dragStart(event,${i})" onclick="selectItem(${i})" aria-label="${escaped(it[1])}"><span>${it[0]}</span>${escaped(it[1])}</button>`).join('');let bins=t.groups.map((g,j)=>`<button class="bin" ondragover="event.preventDefault()" ondrop="dropBin(event,${j})" onclick="chooseBin(${j})"><span>${g[0]}</span>${escaped(g[1])}</button>`).join('');return `<div class="count">${state.done.length}/${t.items.length} elementos correctamente agrupados</div><div class="items">${items}</div><div class="bins">${bins}</div><p class="count">👆 Toca un objeto y después un grupo, o arrástralo.</p>`}function selectItem(i){if(state.done.includes(i))return;state.selected=i;drawPlay()}function dragStart(e,i){state.selected=i;try{e.dataTransfer.setData('text/plain',String(i))}catch{}}function dropBin(e,j){e.preventDefault();let k=state.selected;try{let x=e.dataTransfer.getData('text/plain');if(x!=='')k=Number(x)}catch{};state.selected=k;chooseBin(j)}function chooseBin(j){let i=state.selected,t=task();if(i<0||state.done.includes(i)){announce('Primero elige un objeto para agrupar.',false);return}if(t.items[i][2]===j){state.done.push(i);state.selected=-1;drawPlay();if(state.done.length===t.items.length)finish();else announce('¡Muy bien! ¡Encontraste el grupo correcto!',true)}else{state.mistakes++;announce('Casi, casi. Ese objeto pertenece a otro grupo. ¡Inténtalo otra vez!',false)}}
function renderHunt(t){return `<div class="count">🔎 ${state.done.length} de ${t.items.filter(x=>x[2]).length} encontrados</div><div class="huntgrid">${t.items.map((it,i)=>`<button class="huntobj ${state.done.includes(i)?'found':''}" onclick="hunt(${i})" ${state.done.includes(i)?'disabled':''}><span>${it[0]}</span><small>${escaped(it[1])}${state.done.includes(i)?' ✅':''}</small></button>`).join('')}</div>`}function hunt(i){let t=task();if(state.done.includes(i))return;if(t.items[i][2]){state.done.push(i);drawPlay();if(state.done.length===t.items.filter(x=>x[2]).length)finish();else announce('¡Lo encontraste! ¡Sigue buscando!',true)}else{state.mistakes++;announce('¡Ese no! Observa con atención y vuelve a intentarlo.',false)}}
function renderSequence(t){let slots=t.steps.map((x,i)=>`<div class="slot">${state.order[i]!==undefined?`<b>${t.steps[state.order[i]][0]}</b>${escaped(t.steps[state.order[i]][1])}`:`<b>${i+1}</b>¿Qué sigue?`}</div>`).join('');let seed=(state.world*31+state.challenge*7)%7;let indices=t.steps.map((_,i)=>i).sort((a,b)=>((a*7+seed)%t.steps.length)-((b*7+seed)%t.steps.length));if(indices.every((n,i)=>n===i))indices.reverse();return `<p class="count">👆 Toca los dibujos en el orden correcto</p><div class="sequenceSlots">${slots}</div><div class="sequence">${indices.map(i=>`<button class="seqchoice ${state.order.includes(i)?'used':''}" onclick="sequencePick(${i})"><b>${t.steps[i][0]}</b>${escaped(t.steps[i][1])}</button>`).join('')}</div>`}function sequencePick(i){let expected=state.order.length;if(i===expected){state.order.push(i);drawPlay();if(state.order.length===task().steps.length)finish();else announce('¡Correcto! ¿Qué sucede después?',true)}else{state.mistakes++;announce('Todavía no. Piensa qué sucede primero y vuelve a intentarlo.',false)}}
const simNames={plant:['🌰','🌱','🪴','🌻'],rescue:['🌲','🌳🦙','🌳🦅','🌳🐻'],clean:['🏞️🗑️','🏞️🧴','🏞️✨','🏞️🐟'],rocket:['🚀🌎','🚀🔴','🚀🪐','🚀🔵'],orbit:['🌎☀️','🌗🌎','🌎🌙','🌎☀️'],soil:['🏜️','🏺','🌱'],water:['🌊','☀️💨','☁️','🌧️']};function renderSim(t){let s=t.sim,c=state.simCount,display=simNames[s][Math.min(c,simNames[s].length-1)];let desc='',ctrl='';if(s==='plant'){desc=['Una semilla está dormida.','¡Ha salido un brote!','¡Mira cómo crece!','¡Floreció!'][Math.min(c,3)];ctrl='<button class="btn" onclick="simAction(1)">💧 Regar la planta</button>'}if(s==='rescue'){desc=['¡El bosque necesita protección!','¡Plantaste un árbol!','¡Protegiste al cóndor!','¡Salvaste el hábitat!'][Math.min(c,3)];ctrl=['🌱 Plantar árboles','🛑 Evitar la caza','💚 Cuidar el bosque'].map((x,i)=>`<button class="btn" onclick="simAction(${i+1})" ${c!==i?'disabled style="opacity:.4"':''}>${x}</button>`).join('')}if(s==='clean'){desc=`Has recogido ${c} de 5 residuos del río`;ctrl='<button class="btn" onclick="simAction(1)">🧤 Recoger basura</button>'}if(s==='rocket'){desc=`¡Visitaste ${c} de 3 planetas!`;ctrl=['🔴 Marte','🪐 Saturno','🔵 Neptuno'].map((x,i)=>`<button class="btn" onclick="simAction(${i+1})" ${c!==i?'disabled style="opacity:.4"':''}>${x}</button>`).join('')}if(s==='orbit'){display=state.simVal>65?'🌙🌎':state.simVal>30?'🌗🌎':'🌞🌎';desc=state.simVal>65?'¡Ahora es de noche en este lado!':state.simVal>30?'¡Está anocheciendo!':'¡Es de día en este lado!';ctrl=`<label for="orbitrange">Gira la Tierra: <b>${state.simVal}%</b></label><input class="simrange" id="orbitrange" type="range" min="0" max="100" value="${state.simVal}" oninput="orbitChange(this.value)" aria-label="Girar la Tierra">`}if(s==='soil'){desc=c===0?'¿Cuál suelo es mejor para cultivar?':c===1?'¡La arena deja pasar rápido el agua!':c===2?'¡La arcilla tiene partículas finas!':'¡El humus favorece a las plantas!';ctrl=['🏜️ Arenoso','🏺 Arcilloso','🌱 Humífero'].map((x,i)=>`<button class="btn" onclick="simAction(${i+1})">${x}</button>`).join('')}if(s==='water'){desc=['El agua está en el mar.','El calor evapora el agua.','El vapor forma las nubes.','¡La lluvia vuelve a la Tierra!'][Math.min(c,3)];ctrl=['☀️ Calentar el agua','☁️ Formar la nube','🌧️ Hacer llover'].map((x,i)=>`<button class="btn" onclick="simAction(${i+1})" ${c!==i?'disabled style="opacity:.4"':''}>${x}</button>`).join('')}return `<div class="simscene"><div class="simvisual" id="simvisual" style="transform:rotate(${s==='orbit'?state.simVal*3.6:0}deg)">${display}</div><div class="simdesc" id="simdesc">${desc}</div><div class="simcontrols" id="simcontrols">${ctrl}</div></div>`}function orbitChange(v){state.simVal=Number(v);let vis=document.getElementById('simvisual');if(vis){vis.textContent=state.simVal>65?'🌙🌎':state.simVal>30?'🌗🌎':'🌞🌎';vis.style.transform='rotate('+state.simVal*3.6+'deg)'}let d=document.getElementById('simdesc');if(d)d.textContent=state.simVal>65?'¡Ahora es de noche en este lado!':state.simVal>30?'¡Está anocheciendo!':'¡Es de día en este lado!';if(state.simVal===100&&!state.simDone){state.simDone=true;finish()}}function simAction(choice){let s=task().sim;initAudio();if(s==='soil'){if(choice===3){state.simCount=3;drawPlay();finish()}else{state.simCount=choice;drawPlay();announce(choice===1?'La arena no retiene tanta agua. Prueba otro tipo de suelo.':'La arcilla retiene mucha agua. Busca el suelo rico en humus.',false)}return}if(['rescue','rocket','water'].includes(s)&&choice!==state.simCount+1){announce('¡Vamos en orden! Elige el siguiente paso.',false);return}state.simCount++;drawPlay();let target=s==='clean'?5:3;if(state.simCount>=target)finish();else announce(['¡Buen trabajo, continúa!','¡Fantástico, un paso más!','¡Qué gran explorador!'][state.simCount%3],true)}
function finish(){const k=state.world+'-'+state.challenge;let isNew=!completed(state.world,state.challenge);if(isNew){saved[k]=true;store();state.sessionScore+=3}popStars();sfx(true);let done=worlds[state.world].challenges.filter((_,i)=>completed(state.world,i)).length;let all=done===6;let message=all?'¡Completaste las seis misiones de este mundo! ¡Medalla ganada!':'¡Terminaste el desafío y ganaste tres estrellas!';say(`¡Felicidades, Yance! ${message}`);popRoot.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="Reto completado"><div class="medal">${all?'🏆':'🌟'}</div><h2>¡BRAVO, YANCE!</h2><p>${message}</p><p><strong>⭐ ${totalStars()} estrellas en total</strong></p><button class="bigbtn" onclick="closeWin()">${all?'🗺️ Ver los mundos':'🚀 ¡Siguiente misión!'}</button></div></div>`}function closeWin(){popRoot.innerHTML='';let all=worlds[state.world].challenges.every((_,i)=>completed(state.world,i));if(all){goHome()}else{let i=worlds[state.world].challenges.findIndex((_,j)=>j>state.challenge&&!completed(state.world,j));if(i===-1)i=worlds[state.world].challenges.findIndex((_,j)=>!completed(state.world,j));state.challenge=i;resetTask();drawPlay();say(task().hint)}}
